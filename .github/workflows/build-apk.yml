name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "GifWidgets-${GITHUB_REF_NAME}.apk"

      - name: Keep the APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GifWidgets-apk
          path: GifWidgets-*.apk

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GifWidgets-*.apk
          generate_release_notes: true
