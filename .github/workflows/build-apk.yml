# Builds the release APK on GitHub's servers.
#  - Push a tag like v1.0 (git tag v1.0 && git push --tags)  -> APK is attached to a GitHub Release.
#  - Or run it by hand: Actions tab -> "Build APK" -> Run workflow -> APK is downloadable as an artifact.
name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed only to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "GifWidgets-${GITHUB_REF_NAME}.apk"

      - name: Keep the APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GifWidgets-apk
          path: GifWidgets-*.apk

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GifWidgets-*.apk
          generate_release_notes: true

